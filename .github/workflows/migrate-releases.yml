name: Migrate existing downloads
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Copy and verify existing public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os,subprocess,json,hashlib,time
          from pathlib import Path
          env=os.environ.copy()
          def gh(*args):
           return subprocess.check_output(['gh',*args],env=env,text=True)
          source='Nucizz/OrdinaryNotch-Releases';target='Nucizz/OrdinaryNotch-Free'
          def destination(tag):
           for attempt in range(10):
            matches=[r for r in json.loads(gh('api',f'repos/{target}/releases')) if r['tag_name']==tag]
            if matches:return matches[0]
            time.sleep(2)
           raise RuntimeError('New draft is not visible yet')
          releases=json.loads(gh('api',f'repos/{source}/releases'))
          for release in reversed(releases):
           tag=release['tag_name']; folder=Path('/tmp/ordinary-release-migration')/tag;folder.mkdir(parents=True,exist_ok=True)
           print('Downloading',tag,flush=True)
           subprocess.run(['gh','release','download',tag,'--repo',source,'--dir',str(folder),'--skip-existing'],env=env,check=True)
           for asset in release['assets']:
            path=folder/asset['name']; digest=hashlib.file_digest(path.open('rb'),'sha256').hexdigest() if hasattr(hashlib,'file_digest') else hashlib.sha256(path.read_bytes()).hexdigest()
            assert path.stat().st_size==asset['size'] and 'sha256:'+digest==asset['digest'],asset['name']
           notes=folder/'notes.md'
           notes.write_text('Official Ordinary Notch macOS installer and Sparkle-signed update archive. Download OrdinaryNotch.dmg to install.\n\nThese binaries include optional paid Pro features. The source in this repository covers the Free edition only; premium source remains private. The MIT license applies to the published source, not the proprietary Pro components in these binaries.\n\nAd-hoc signed; not Apple notarized. Migrated unchanged from the previous downloads repository.\n')
           existing=json.loads(gh('api',f'repos/{target}/releases'))
           if not any(r['tag_name']==tag for r in existing):
            gh('release','create',tag,'--repo',target,'--draft','--title','Ordinary Notch '+tag[1:],'--notes-file',str(notes))
           for asset in release['assets']:
            dest=destination(tag)
            match=next((a for a in dest['assets'] if a['name']==asset['name']),None)
            if not match: gh('release','upload',tag,'--repo',target,str(folder/asset['name']))
           dest=destination(tag)
           for asset in release['assets']:
            match=next(a for a in dest['assets'] if a['name']==asset['name'])
            assert match['size']==asset['size'] and match['digest']==asset['digest']
           if dest['draft']: gh('release','edit',tag,'--repo',target,'--draft=false','--latest')
           print('Published and checksum verified',tag,flush=True)
