name: Free app checks
on:
  workflow_dispatch:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-source-scope.py
      - run: swift test
      - run: python3 scripts/build-app.py
